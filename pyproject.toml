[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiasumiles-mcp"
version = "0.1.0"
description = "SG's first AI-powered miles card optimizer — tells your agent which credit card earns the most miles at any merchant, based on MCC codes. Works offline, no API keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Hosan", email = "hosanxiv@gmail.com" }
]
keywords = ["singapore", "credit-card", "miles", "mcp", "kiasumiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
kiasumiles-mcp = "kiasumiles.server:main"
kiasumiles-setup = "kiasumiles.setup:main"

[tool.hatch.build.targets.wheel]
packages = ["kiasumiles"]
include = ["kiasumiles/data/*.csv"]

[project.urls]
Homepage = "https://github.com/hosanxiv/kiasumiles"
Repository = "https://github.com/hosanxiv/kiasumiles.git"
Documentation = "https://github.com/hosanxiv/kiasumiles#readme"
"Bug Tracker" = "https://github.com/hosanxiv/kiasumiles/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
