[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiasumiles-mcp"
version = "1.0.2"
description = "Singapore miles card optimizer with a local wallet and live hosted recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hosan" }
]
keywords = ["singapore", "credit-card", "miles", "mcp", "kiasumiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
kiasumiles-mcp = "kiasumiles.local:main"
kiasumiles-hosted = "kiasumiles.hosted:main"
kiasumiles-feedback-bot = "kiasumiles.feedback_bot:main"

[tool.hatch.build.targets.wheel]
packages = ["kiasumiles"]
# Large landing-page media is deliberately not shipped in the wheel. The
# lightweight resources used by hosted.py are selectively included below.
include = ["kiasumiles/data/demo/*.csv"]
exclude = ["kiasumiles/static/"]

[tool.hatch.build.targets.wheel.force-include]
"kiasumiles/static/kiasumiles/index.html" = "kiasumiles/static/kiasumiles/index.html"
"kiasumiles/static/kiasumiles/privacy.html" = "kiasumiles/static/kiasumiles/privacy.html"
"kiasumiles/static/kiasumiles/favicon.svg" = "kiasumiles/static/kiasumiles/favicon.svg"
"kiasumiles/static/kiasumiles/assets/proof" = "kiasumiles/static/kiasumiles/assets/proof"

[tool.hatch.build.targets.sdist]
include = [
    "/kiasumiles",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "**/__pycache__/",
    "**/*.pyc",
    "kiasumiles/static/",
]

[tool.hatch.build.targets.sdist.force-include]
"kiasumiles/static/kiasumiles/index.html" = "kiasumiles/static/kiasumiles/index.html"
"kiasumiles/static/kiasumiles/privacy.html" = "kiasumiles/static/kiasumiles/privacy.html"
"kiasumiles/static/kiasumiles/favicon.svg" = "kiasumiles/static/kiasumiles/favicon.svg"
"kiasumiles/static/kiasumiles/assets/proof" = "kiasumiles/static/kiasumiles/assets/proof"

[project.urls]
Homepage = "https://github.com/hosanxiv/kiasumiles"
Repository = "https://github.com/hosanxiv/kiasumiles.git"
Documentation = "https://github.com/hosanxiv/kiasumiles#readme"
"Bug Tracker" = "https://github.com/hosanxiv/kiasumiles/issues"

[project.optional-dependencies]
dev = ["hatchling>=1.29", "pytest>=8.0", "pytest-asyncio>=0.23"]
