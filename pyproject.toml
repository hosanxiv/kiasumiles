[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiasumiles-mcp"
version = "1.0.2"
description = "Singapore miles card optimizer with a local wallet and live hosted recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hosan", email = "hosanxiv@gmail.com" }
]
keywords = ["singapore", "credit-card", "miles", "mcp", "kiasumiles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
kiasumiles-mcp = "kiasumiles.local:main"
kiasumiles-hosted = "kiasumiles.hosted:main"
kiasumiles-feedback-bot = "kiasumiles.feedback_bot:main"

[tool.hatch.build.targets.wheel]
packages = ["kiasumiles"]
# Landing-page media (kiasumiles/static/) is deliberately NOT shipped in the
# wheel — Vercel serves it from the repo; pip users don't need 3.7MB of video.
include = ["kiasumiles/data/demo/*.csv"]
exclude = ["kiasumiles/static/"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".venv/",
    "*.token",
    ".env",
    ".env.*",
    "kiasumiles/static/",
]

[project.urls]
Homepage = "https://github.com/hosanxiv/kiasumiles"
Repository = "https://github.com/hosanxiv/kiasumiles.git"
Documentation = "https://github.com/hosanxiv/kiasumiles#readme"
"Bug Tracker" = "https://github.com/hosanxiv/kiasumiles/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
